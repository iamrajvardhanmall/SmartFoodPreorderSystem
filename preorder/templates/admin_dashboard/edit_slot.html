{% extends 'base.html' %}

{% block title %}Edit Time Slot — Smart Food Stall{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow rounded-4">
      <div class="card-header bg-primary text-white rounded-top-4">
        <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Edit Slot — {{ slot.slot_name }}</h5>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Slot Name</label>
            {{ form.slot_name }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Max Capacity</label>
            {{ form.max_capacity }}
          </div>
          <div class="form-check mb-4">
            {{ form.is_active }}
            <label class="form-check-label">Active</label>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-save"></i> Save Changes
            </button>
            <a href="{% url 'manage_slots' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
