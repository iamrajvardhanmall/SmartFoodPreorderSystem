{% extends 'base.html' %}

{% block title %}Login — Smart Food Stall{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow border-0 rounded-4">
      <div class="card-body p-4">

        <div class="text-center mb-4">
          <i class="bi bi-lock-fill text-success" style="font-size: 2.5rem;"></i>
          <h4 class="fw-bold mt-2">Welcome Back</h4>
          <p class="text-muted small">Login to pre-order your food</p>
        </div>

        <form method="POST" novalidate>
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control"
                     placeholder="Enter your username" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input type="password" name="password" id="passwordInput"
                     class="form-control" placeholder="Enter your password" required>
              <button type="button" class="btn btn-outline-secondary"
                      onclick="togglePassword('passwordInput', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-success btn-lg">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
          </div>
        </form>

        <hr class="my-3">
        <p class="text-center mb-0 small">
          Don't have an account?
          <a href="{% url 'register' %}" class="text-success fw-semibold">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
